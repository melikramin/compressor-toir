# compressor-toir — зеркало таблицы 1С:ТОиР в локальной базе клиента.
# Наружу не публикуется ничего: sync ходит сам, 1С подключается к postgres.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      POSTGRES_DB: ${POSTGRES_DB:-toir}
    # PG_BIND=0.0.0.0 — 1С подключается с других машин (сеть или интернет);
    # 127.0.0.1 — 1С на этом же сервере. При 0.0.0.0 защита только паролем,
    # трафик не шифруется — по возможности ограничьте порт файрволом.
    ports: ["${PG_BIND:-127.0.0.1}:${PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toir}"]
      interval: 5s
      timeout: 3s
      retries: 10

  sync:
    build: ./sync
    logging: *logging
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
